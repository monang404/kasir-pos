name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kasir
          POSTGRES_PASSWORD: kasir
          POSTGRES_DB: kasir_pos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install -r backend/requirements.txt
      - name: Lint (ruff)
        run: ruff check backend
      - name: Test (pytest)
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://kasir:kasir@localhost:5432/kasir_pos_test
        run: PYTHONPATH=backend pytest tests/backend -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: npm install
      - name: Typecheck
        run: npx tsc -b
      - name: Test (vitest)
        run: npx vitest run --passWithNoTests
