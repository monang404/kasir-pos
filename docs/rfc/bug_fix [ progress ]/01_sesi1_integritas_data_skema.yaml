  - id: "1.3"
    judul: "INSERT produk_batch menyertakan kolom qty_masuk (NOT NULL)"
    temuan_ref: [1]
    severity: Critical
    status: done
    depends_on: []
    files:
      edit:
        - backend/app/inventory/fifo_service.py       # fungsi tambah_stok(), line 19-26
        - backend/app/inventory/batch_crud.py          # fungsi tambah_batch(), line 77-84
        - backend/app/transaksi/delete_transaksi.py    # retur stok saat hapus transaksi, line 41-51
        - backend/app/transaksi/edit_item.py           # retur stok saat qty turun, line ~96-106 (blok "else: qty TURUN")
      dokumentasi_opsional:
        - AI_CONTEXT.md   # §4: perbaiki catatan scope "Temuan 29-36" -> jelaskan rencana diperluas ke 1-36 (lihat 00_index.yaml)
        - STATUS.md        # header: sinkronkan current_task dengan scope baru
    masalah: |
      migrations/0001_produk_batch_pelanggan.sql baris 22 mendefinisikan
      `qty_masuk INT NOT NULL` tanpa default. Keempat file di atas melakukan
      `INSERT INTO produk_batch (produk_id, qty_sisa, harga_beli, tanggal_masuk)`
      -- TIDAK PERNAH menyertakan qty_masuk. Setiap INSERT ini akan gagal
      dengan `ERROR: null value in column "qty_masuk"` di Postgres asli
      (terverifikasi 2026-07-31 langsung terhadap kode saat ini). Dampak:
      tambah stok, retur transaksi (hapus/edit-qty), dan tambah batch manual
      SEMUA selalu gagal -- aplikasi tidak bisa dipakai untuk operasi stok
      apa pun.
    solusi:
      - "Di fifo_service.py::tambah_stok -- tambahkan kolom qty_masuk ke INSERT, isi dengan nilai `qty` yang sama dengan qty_sisa awal."
      - "Di batch_crud.py::tambah_batch -- sama, isi qty_masuk = req.qty."
      - "Di delete_transaksi.py -- isi qty_masuk = item.qty (qty yang diretur, sama dengan qty_sisa batch retur baru)."
      - "Di edit_item.py blok qty-turun -- isi qty_masuk = qty_retur (sama dengan qty_sisa batch retur baru)."
      - "Pastikan semua 4 lokasi memakai nama parameter yang konsisten (mis. :qty_masuk) agar mudah di-audit lewat automation/patchlog.py symbol tambah_stok / tambah_batch nanti."
    acceptance_criteria:
      - "Keempat statement INSERT INTO produk_batch menyertakan qty_masuk."
      - "qty_masuk yang di-insert SELALU sama dengan qty_sisa pada baris yang sama (batch baru selalu 'penuh' saat dibuat, sesuai PRD §16)."
      - "Uji manual terhadap Postgres asli (docker compose up --build): tambah stok, retur hapus-transaksi, retur edit-qty-turun, tambah batch manual -- keempatnya berhasil tanpa NOT NULL violation."
      - "Test existing di tests/backend/app/inventory/test_fifo.py dan tests/backend/app/transaksi/test_retur_stok.py tetap hijau (catatan: test ini pakai sqlite in-memory yang TIDAK enforce constraint qty_masuk NOT NULL secara sama seperti Postgres -- lihat status_test_suite di 00_index.yaml, jangan andalkan pytest hijau saja untuk task ini)."
    test:
      command: "PYTHONPATH=backend pytest tests/backend/app/inventory tests/backend/app/transaksi -q"
      catatan: "WAJIB verifikasi tambahan manual ke Postgres asli, lihat acceptance_criteria."
    patchlog:
      type: Fix
      area: Backend
      priority: Critical
      breaking: "No"
      risk: Low
      title_saran: "Sertakan qty_masuk pada seluruh INSERT produk_batch (Temuan 1)"

