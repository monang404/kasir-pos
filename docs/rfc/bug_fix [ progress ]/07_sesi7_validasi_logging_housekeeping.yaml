  # ---------------------------------------------------------------------
  - id: "7.9"
    judul: "Perbaiki unit SESSION_TIMEOUT di docker-compose.yml"
    temuan_ref: [33]
    severity: Medium
    status: pending
    depends_on: []
    files:
      edit:
        - docker-compose.yml   # line 34, SESSION_TIMEOUT: "3600"
    masalah: |
      backend/app/auth/security.py membaca SESSION_TIMEOUT sebagai MENIT
      (`SESSION_TIMEOUT_MINUTES = int(os.environ.get("SESSION_TIMEOUT", "60"))`),
      dan docs/PRD.md mengonfirmasi kontrak ini (default 60 MENIT). Tapi
      docker-compose.yml men-set `SESSION_TIMEOUT: "3600"` -- nilai khas
      untuk satuan DETIK (3600 detik = 1 jam). Karena kode membaca ini
      sebagai menit, hasil sebenarnya adalah 3600 MENIT = 60 JAM masa
      berlaku token, alih-alih 1 jam yang tampaknya dimaksud, memperbesar
      jendela risiko bila token dicuri/bocor.
    solusi:
      - "Ubah nilai di docker-compose.yml menjadi `SESSION_TIMEOUT: \"60\"` (60 menit, sesuai kontrak PRD & default kode)."
      - "PERTIMBANGAN TAMBAHAN (opsional, disebut di laporan audit sebagai solusi jangka panjang): ganti nama env var jadi eksplisit satuannya (mis. SESSION_TIMEOUT_MINUTES) di security.py DAN docker-compose.yml sekaligus, supaya kesalahan unit yang sama tidak terulang di masa depan -- jika dilakukan, ini breaking change untuk deployment lain yang mungkin sudah set SESSION_TIMEOUT (bukan SESSION_TIMEOUT_MINUTES) secara manual, dokumentasikan di changelog."
    acceptance_criteria:
      - "Token JWT pada deployment default (docker-compose bawaan repo) valid 60 menit, bukan 60 jam (uji: cek field exp di token yang di-decode setelah login)."
    test:
      command: "PYTHONPATH=backend pytest tests/backend/app/auth -q"
    patchlog:
      type: Fix
      area: Infrastructure
      priority: Medium
      breaking: "No"
      risk: Low
      title_saran: "Perbaiki unit SESSION_TIMEOUT di docker-compose.yml (Temuan 33)"

  # ---------------------------------------------------------------------
  - id: "7.10"
    judul: "datetime.now() naive vs UTC pada agregasi dashboard"
    temuan_ref: [36]
    severity: Low
    status: pending
    depends_on: ["2.3"]
    files:
      edit:
        - backend/app/dashboard/stats.py    # line 26, 56-60
        - backend/app/dashboard/charts.py   # line 15, 62, 96-99
      infra_terkait:
        - "Dockerfile backend -- pertimbangkan set ENV TZ=UTC eksplisit"
    masalah: |
      Agregasi dashboard ("bulan berjalan", "7 hari terakhir") memakai
      datetime.now() NAIVE (mengikuti timezone sistem tempat proses Python
      berjalan), sementara penulisan timestamp transaksi SELALU memakai
      datetime.now(timezone.utc) eksplisit (checkout_service.py, fifo_service.py,
      batch_crud.py, dst.). Jika container backend tidak dikonfigurasi
      eksplisit ke UTC dan berjalan di server dengan timezone lain (mis.
      WIB/UTC+7, relevan untuk operasional toko di Indonesia), transaksi
      yang dibuat menjelang tengah malam bisa masuk ke "hari"/"bulan" yang
      berbeda antara data tersimpan (UTC) dan agregasi dashboard (lokal
      container) -- perbandingan "bulan ini vs bulan lalu" bisa keliru di
      sekitar pergantian bulan.
    solusi:
      - "Ganti seluruh `datetime.now()` di kedua file dengan `datetime.now(timezone.utc)`, konsisten dengan seluruh codebase lain."
      - "Tambahkan `ENV TZ=UTC` di backend/Dockerfile agar container selalu berjalan UTC terlepas dari host, sebagai lapisan tambahan (defense in depth) di luar fix kode Python."
      - "Task ini SENGAJA dipisah dari task 2.3 (migrasi strftime() di file yang sama) karena beda root cause -- kerjakan SETELAH 2.3 supaya tidak bentrok menyunting baris yang sama secara bersamaan."
    acceptance_criteria:
      - "Kedua file tidak lagi memanggil datetime.now() tanpa argumen timezone."
      - "Uji dengan container di-set TZ non-UTC (mis. Asia/Jakarta) secara sengaja -- agregasi 'bulan ini' tetap konsisten dengan data yang tersimpan (UTC), tidak bergeser."
    test:
      command: "PYTHONPATH=backend pytest tests/backend/app/dashboard -q"
    patchlog:
      type: Fix
      area: Backend
      priority: Low
      breaking: "No"
      risk: Low
      title_saran: "datetime.now(timezone.utc) konsisten di dashboard (Temuan 36)"
