  # ---------------------------------------------------------------------
  - id: "7.3"
    judul: "Import Excel: savepoint per baris, andalkan constraint unik DB"
    temuan_ref: [19]
    severity: Low
    status: pending
    depends_on: []
    files:
      edit:
        - backend/app/inventory/import_excel.py   # line 51-53 (existing_kodes in-memory), 58-108 (loop per baris), 89-103 (cek in-memory), 111-121 (activity_log insert)
    masalah: |
      Cache kode produk in-memory (existing_kodes) diambil SEKALI di awal,
      dicek in-memory bukan mengandalkan constraint unik database. Tiap
      baris dibungkus try/except Exception GENERIK yang menganggap error
      hanya berlaku per baris -- padahal jika db.execute() gagal karena
      pelanggaran constraint unik (mis. kode yang baru saja di-insert oleh
      request lain), PostgreSQL menandai SELURUH transaksi sebagai aborted --
      seluruh db.execute() berikutnya pada request yang sama (baris-baris
      selanjutnya, maupun insert activity_log) ikut gagal tanpa penjelasan
      bahwa itu penyebabnya.
    solusi:
      - "Andalkan constraint unik database (kode UNIQUE, lihat migrations/0001) sebagai sumber kebenaran akhir -- hapus/kurangi ketergantungan pada existing_kodes in-memory untuk deteksi duplikat (tetap boleh dipakai untuk deteksi duplikat DALAM file excel yang sama, tapi bukan terhadap database)."
      - "Gunakan SAVEPOINT per baris (SQLAlchemy: `with db.begin_nested():` per baris) atau tangani IntegrityError secara eksplisit dengan rollback ke savepoint -- satu baris bermasalah tidak boleh meracuni transaksi keseluruhan."
      - "Pastikan insert activity_log (line 111-121) di LUAR savepoint per-baris (harus tetap berhasil walau ada baris yang gagal di-import), atau pindahkan ke transaction terpisah."
    acceptance_criteria:
      - "Import Excel dengan 1 baris duplikat kode di tengah file -> baris duplikat tsb gagal DENGAN PESAN JELAS, baris-baris LAIN (sebelum & sesudahnya) tetap berhasil di-import."
      - "activity_log tetap tercatat meski ada baris yang gagal."
    test:
      command: "PYTHONPATH=backend pytest tests/backend/app/inventory -q"
    patchlog:
      type: Fix
      area: Backend
      priority: Low
      breaking: "No"
      risk: Medium
      title_saran: "Import Excel: savepoint per baris (Temuan 19)"

