  - id: "7.1"
    judul: "CheckoutRequest.pelanggan_id: int|None (bukan int = None)"
    temuan_ref: [10]
    severity: Medium
    status: pending
    depends_on: []
    files:
      edit:
        - backend/app/kasir/checkout_service.py   # line 19
    masalah: |
      `pelanggan_id: int = None` (bukan `int | None = None`). Dengan
      Pydantic 2.13, `M(pelanggan_id=None)` -> ValidationError: Input should
      be a valid integer. Kasus umum "transaksi tanpa pelanggan" yang
      dikirim sebagai `"pelanggan_id": null` DITOLAK, padahal valid secara
      bisnis (checkout tanpa memilih pelanggan adalah alur normal kasir).
    solusi:
      - "Ubah anotasi tipe `pelanggan_id: int | None = None`."
      - "Grep field lain di codebase dengan pola `: int = None` atau `: str = None` (tanpa `| None`) yang mungkin punya bug sama tapi belum tercatat di laporan audit -- perbaiki sekalian jika ditemukan, catat di catatan task."
    acceptance_criteria:
      - "Checkout dengan `pelanggan_id: null` di request body berhasil (tidak 422)."
      - "Checkout dengan pelanggan_id valid tetap berfungsi normal."
    test:
      command: "PYTHONPATH=backend pytest tests/backend/app/kasir -q"
    patchlog:
      type: Fix
      area: Backend
      priority: Medium
      breaking: "No"
      risk: Low
      title_saran: "CheckoutRequest.pelanggan_id jadi int | None (Temuan 10)"

