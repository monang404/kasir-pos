  - id: "4.5"
    judul: "Jangan expose pesan exception internal mentah ke client"
    temuan_ref: [18]
    severity: Low
    status: pending
    depends_on: []
    files:
      edit:
        - backend/app/kasir/checkout_endpoint.py   # line 46-51, detail=f"Terjadi kesalahan internal: {e!s}"
        - backend/app/inventory/import_excel.py     # line 105-108, 136-137
        - backend/app/backup/restore_delete.py       # line 39-43, 68-74
    masalah: |
      Pesan exception mentah (termasuk kemungkinan stack trace/detail internal)
      dikembalikan langsung ke client API di ketiga file ini -- berpotensi
      membocorkan detail implementasi/struktur database ke pengguna akhir.
    solusi:
      - "Di ketiga lokasi: tangkap exception, `logging.exception(...)` (lihat task 7.6 untuk setup modul logging) untuk catat detail lengkap ke log server, lalu kembalikan HTTPException dengan pesan GENERIK ke client (mis. 'Terjadi kesalahan internal, silakan coba lagi atau hubungi admin')."
      - "Task ini SEBAIKNYA dikerjakan SETELAH task 7.6 (setup modul logging) supaya bisa langsung pakai logging.exception() alih-alih print(). Jika dikerjakan lebih dulu, pakai print() sementara dan tandai TODO untuk diganti saat 7.6 selesai -- tapi urutan depends_on di bawah mengasumsikan 7.6 duluan."
    acceptance_criteria:
      - "Response error dari ketiga endpoint tidak lagi mengandung representasi exception Python mentah (str(e)) di field detail."
      - "Detail exception lengkap tetap tercatat di server log untuk debugging."
    test:
      command: "PYTHONPATH=backend pytest tests/backend/app/kasir tests/backend/app/inventory tests/backend/app/backup -q"
    patchlog:
      type: Fix
      area: Backend
      priority: Low
      breaking: "No"
      risk: Low
      title_saran: "Jangan expose exception internal mentah ke client (Temuan 18)"
