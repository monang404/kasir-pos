  # ---------------------------------------------------------------------
  - id: "4.3"
    judul: "Pindahkan state lockout login ke Redis + bersihkan entry lama"
    temuan_ref: [8, 23]
    severity: High
    status: pending
    depends_on: []
    files:
      edit:
        - backend/app/auth/lockout.py   # seluruh file, line 5, 15-54
      dependency_baru:
        - "redis (python client) -- tambahkan ke backend/requirements.txt"
    masalah: |
      Temuan 8 (High): `_lockout_store: dict[str, tuple[int, datetime]] = {}`
      adalah variabel modul tanpa lock, diakses read-modify-write tanpa
      sinkronisasi. docker-compose.yml sudah menyediakan service `redis` dan
      REDIS_URL ke container backend, tapi TIDAK ADA satu pun kode yang
      memakainya -- lockout tidak konsisten di deployment multi-worker
      (umum di produksi uvicorn/gunicorn), sehingga lockout bisa dilewati.

      Temuan 23 (Low, digabung ke task ini karena file & root cause sama):
      entry percobaan gagal yang tidak pernah mencapai MAX_ATTEMPTS dan tidak
      pernah diikuti login berhasil tersimpan PERMANEN di dict in-memory
      selama proses berjalan (memory growth). Redis dengan TTL native
      otomatis menyelesaikan masalah ini juga (key expire sendiri).
    solusi:
      - "Tambahkan `redis` ke backend/requirements.txt."
      - "Ganti _lockout_store dict in-memory dengan Redis: simpan attempts sebagai counter dengan `INCR` (atomik) + `EXPIRE` di key yang sama saat attempt pertama; simpan locked_until sebagai key terpisah dengan TTL = LOCKOUT_SECONDS via `SETEX`."
      - "get_lockout_status() dan record_failed_attempt() diubah untuk baca/tulis ke Redis client (pakai REDIS_URL dari env), bukan dict Python."
      - "Karena Redis key expire otomatis (TTL), Temuan 23 (cleanup manual) otomatis tidak relevan lagi -- tidak perlu mekanisme cleanup terpisah."
      - "Tangani kasus Redis tidak tersedia (connection error) -- putuskan: fail-open (izinkan login, log warning) atau fail-closed (tolak semua login)? Untuk sistem kasir toko, fail-open dengan log warning lebih masuk akal (downtime Redis tidak boleh mengunci semua kasir) -- dokumentasikan keputusan ini di komentar kode & docs/PRD.md §15 Known Issues jika relevan."
    acceptance_criteria:
      - "Lockout tetap konsisten saat diuji dengan 2+ worker/proses backend berjalan bersamaan (uji manual: jalankan uvicorn dengan --workers 2, coba lockout dari 2 koneksi berbeda)."
      - "Entry attempts di Redis punya TTL, tidak pernah menumpuk permanen."
      - "Login berhasil tetap me-reset counter (reset_attempts masih berfungsi, sekarang lewat Redis DEL)."
    test:
      command: "PYTHONPATH=backend pytest tests/backend/app/auth -q"
      catatan: "Butuh Redis berjalan (docker-compose sudah menyediakan service redis) untuk test terhadap implementasi baru."
    patchlog:
      type: Fix
      area: Backend
      priority: High
      breaking: "No"
      risk: Medium
      title_saran: "Lockout login pakai Redis, hapus in-memory dict (Temuan 8, 23)"

  # ---------------------------------------------------------------------
  - id: "4.4"
    judul: "Mekanisme invalidasi token/sesi saat password atau status user berubah"
    temuan_ref: [17]
    severity: Medium
    status: pending
    depends_on: []
    files:
      edit:
        - backend/app/auth/security.py    # create_access_token(), line 37-43
        - backend/app/auth/session.py      # get_current_user() -- perlu validasi tambahan
        - backend/app/users/crud.py         # update_user(), line 90-119
      migrasi_kemungkinan_perlu:
        - "Cek apakah tabel users sudah punya kolom untuk token_version/updated_at yang bisa dipakai sebagai stamp. Jika belum, buat migration baru migrations/0006_users_token_version.sql (nomor lanjutkan dari migration terakhir setelah task 1.4 menambah 0005)."
    masalah: |
      JWT hanya berisi `exp` berbasis waktu, tanpa jti/version stamp yang
      bisa dicabut. Mengganti password/role/status user lain (update_user)
      tidak mencabut token JWT lama milik user tsb -- token tetap valid
      hingga expiry karena get_current_user tidak memvalidasi versi/jti
      apa pun terhadap user record.
    solusi:
      - "Tambahkan kolom `token_version INT NOT NULL DEFAULT 0` (atau pakai updated_at yang sudah ada jika kolomnya ada) ke tabel users lewat migration baru."
      - "create_access_token(): sertakan token_version user saat ini di payload JWT."
      - "get_current_user(): setelah decode JWT, bandingkan token_version di payload dengan token_version TERKINI di database -- jika beda, tolak (401)."
      - "update_user(): setiap kali password/role/status diubah, INCREMENT token_version user tsb di database -- otomatis mencabut semua token lama."
    acceptance_criteria:
      - "Test baru: login (dapat token A) -> ganti password user tsb via update_user -> token A ditolak (401) pada request berikutnya, meski belum expired."
      - "User yang TIDAK diubah tetap bisa pakai token lama seperti biasa (tidak semua user ter-invalidate saat satu user diubah)."
    test:
      command: "PYTHONPATH=backend pytest tests/backend/app/auth tests/backend/app/users -q"
    patchlog:
      type: Fix
      area: Backend
      priority: Medium
      breaking: "No"
      risk: Medium
      title_saran: "Invalidasi token via token_version saat password/role/status berubah (Temuan 17)"

