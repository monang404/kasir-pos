  - id: "4.1"
    judul: "Hapus default SECRET_KEY hardcoded, fail-fast jika env tidak diset"
    temuan_ref: [7]
    severity: High
    status: pending
    depends_on: []
    files:
      edit:
        - backend/app/auth/security.py   # line 8
    masalah: |
      `SECRET_KEY = os.environ.get("SECRET_KEY", "09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7")`.
      Jika env var tidak diset, SEMUA instance memakai key yang sama persis
      dengan yang ada di repository publik -- siapa pun yang baca source code
      bisa memalsukan JWT token untuk role apa pun.
    solusi:
      - "Hapus default hardcoded. Ganti dengan: baca SECRET_KEY dari env, jika kosong/None -> raise RuntimeError saat modul di-import (fail-fast, bukan gagal diam-diam saat request pertama masuk)."
      - "Update docker-compose.yml: tambahkan SECRET_KEY dengan nilai dev-only yang JELAS ditandai 'GANTI DI PRODUKSI' (atau generate random tiap `docker compose up` lewat env_file terpisah yang di-gitignore -- pilih salah satu, dokumentasikan di README.md)."
      - "Update README.md / docs/ARSITEKTUR.md bagian deployment: SECRET_KEY WAJIB diset eksplisit di produksi, sertakan cara generate (mis. `python -c \"import secrets; print(secrets.token_hex(32))\"`)."
    acceptance_criteria:
      - "Menjalankan aplikasi tanpa env var SECRET_KEY sama sekali -> proses gagal start dengan pesan error yang jelas, BUKAN start dengan key hardcoded diam-diam."
      - "docker-compose.yml tetap bisa `docker compose up` langsung (sudah menyediakan SECRET_KEY dev-only di file, bukan hardcode di source Python)."
    test:
      command: "PYTHONPATH=backend pytest tests/backend/app/auth -q"
    patchlog:
      type: Fix
      area: Backend
      priority: High
      breaking: "Yes"
      risk: Low
      title_saran: "Hapus default SECRET_KEY hardcoded, fail-fast (Temuan 7)"
      catatan_breaking: "Breaking=Yes karena deployment yang belum set SECRET_KEY sekarang akan gagal start (ini justru tujuan fix-nya)."

