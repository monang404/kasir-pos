open_questions_from_prd:
  description: "Pertanyaan di PRD §18 yang harus dikonfirmasi ke pemilik produk sebelum task terkait dianggap benar-benar 'done'."
  items:
    - "Apakah kalkulator.py (kalkulator kebutuhan cat) perlu diporting? -> relevan untuk task 9 (scope decision)."
    - "Apakah produk yang sudah pernah terjual tetap boleh dihapus (bug atau perilaku diterima)? -> relevan untuk task 4."
    - "Apakah kode transaksi salah di popup sukses checkout perlu diperbaiki? -> relevan untuk task 3."
    - "Apakah bonus_kasir/transaksi_bonus perlu diimplementasikan penuh atau dihapus dari skema? -> relevan untuk task 1 & 8."
