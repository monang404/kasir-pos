task:
  id: "8"
  title: "Intelligence / ML"
  goal: >
    Bangun paling terakhir; jalankan sebagai job async/backend terpisah (bukan on-demand
    blocking), precompute & cache hasil alih-alih retrain dari nol tiap request
    (docs/PRD.md §18 poin 8).
  depends_on: ["7"]
  references: ["docs/PRD.md §14"]

subtasks:
  - id: "8.1"
    title: "Infrastruktur job async + cache hasil ML"
    description: >
      Setup job queue (mis. Celery/RQ/BullMQ tergantung stack) + cache (Redis atau tabel DB)
      untuk hasil model, agar halaman ML tidak retrain dari nol tiap dibuka/refresh seperti
      sistem lama.
    deliverables:
      - "backend/ml/job_infra.*"
    acceptance_criteria:
      - "Refresh halaman ML dalam rentang cache masih valid tidak memicu training ulang"
    commands:
      - >
        python3 implementasi_plan/scripts/finish_subtask.py --task 8.1
        --title "Infrastruktur job async & cache ML"
        --desc "Job queue + cache hasil model, hindari retrain tiap request"
        --files backend/ml/job_infra.py --status done

  - id: "8.2"
    title: "Prediksi Stok (moving average 90 hari + confidence)"
    description: >
      Rolling window 7 hari untuk avg harian, confidence dari jumlah data historis + CV.
      Status: Kritis(<=7 hari), Rendah(<=14), Normal(<=30), Aman(>30), tidak_bergerak/no_data.
      reorder_qty = max(0, avg_daily*14 - stok_sekarang).
    deliverables:
      - "backend/ml/prediksi_stok.*"
    acceptance_criteria:
      - "reorder_qty tidak pernah negatif"
      - "Status kategori sesuai ambang batas hari yang didefinisikan"
    commands:
      - >
        python3 implementasi_plan/scripts/finish_subtask.py --task 8.2
        --title "Prediksi stok moving average"
        --desc "Confidence score, status kategori, reorder_qty"
        --files backend/ml/prediksi_stok.py --status done

  - id: "8.3"
    title: "Prediksi Omzet (HoltES vs RandomForest, pilih RMSE terbaik)"
    description: >
      HoltES manual (alpha=0.3 beta=0.1) untuk data <35 hari valid; RandomForestRegressor
      (fallback regresi linear 3-fitur jika sklearn tidak ada) dengan fitur lag_1/7/30,
      rolling mean/std, trend, hari_minggu, bulan, is_weekend. Walk-forward prediction,
      confidence menurun linear. Split train/test time-based 80/20, pilih model RMSE terkecil.
    deliverables:
      - "backend/ml/prediksi_omzet.*"
    acceptance_criteria:
      - "Model dipilih otomatis berdasarkan RMSE test-set, bukan hardcoded"
      - "Aplikasi tetap berjalan tanpa sklearn terinstall (fallback aktif)"
    commands:
      - >
        python3 implementasi_plan/scripts/finish_subtask.py --task 8.3
        --title "Prediksi omzet HoltES/RandomForest"
        --desc "Pemilihan model otomatis via RMSE, fallback tanpa sklearn"
        --files backend/ml/prediksi_omzet.py --status done

  - id: "8.4"
    title: "Prediksi Demand + Bonus Kasir"
    description: >
      Top-N produk skor kombinasi qty & tren, opsional Gradient Boosting untuk qty 30 hari.
      Skor kasir 0-100 (50% omzet relatif + growth maks 30 poin + 20% avg transaksi relatif),
      tier Platinum/Gold/Silver sesuai ambang PRD §14. Tulis ke tabel bonus_kasir HANYA jika
      keputusan task 1.4 memilih implementasi penuh; jika tidak, tetap kalkulasi tampilan saja.
    deliverables:
      - "backend/ml/prediksi_demand.*"
      - "backend/ml/bonus_kasir.*"
    acceptance_criteria:
      - "Tier bonus kasir sesuai ambang skor & syarat tambahan (Silver butuh omzet top-1/3 & transaksi>=5)"
    commands:
      - >
        python3 implementasi_plan/scripts/finish_subtask.py --task 8.4
        --title "Prediksi demand & bonus kasir"
        --desc "Top-N produk + skor kasir + tier bonus sesuai keputusan task 1.4"
        --files backend/ml/prediksi_demand.py,backend/ml/bonus_kasir.py --status done

  - id: "8.5"
    title: "Rekomendasi Promo/Bonus Item & Upselling (+ Apriori bundling)"
    description: >
      Rekomendasi bonus/tebus murah (stok menumpuk, tren lemah, estimasi habis >45 hari) dan
      upselling (fast-moving/tren naik). Model Apriori sederhana untuk pasangan produk yang
      sering dibeli bersamaan; ekspos SEMUA fungsi (bundling & upsell) di UI, tidak seperti
      sistem lama yang partial-exposed.
    deliverables:
      - "backend/ml/promo_recommendation.*"
    acceptance_criteria:
      - "Rekomendasi bundling dari Apriori benar-benar ditampilkan di UI, tidak hanya tersedia di service"
    commands:
      - >
        python3 implementasi_plan/scripts/finish_subtask.py --task 8.5
        --title "Rekomendasi promo/bonus & Apriori bundling"
        --desc "Bonus/upsell + tampilkan penuh hasil Apriori bundling di UI"
        --files backend/ml/promo_recommendation.py --status done

  - id: "8.6"
    title: "Halaman Intelligence/ML frontend (5 tab, admin-only)"
    description: >
      5 tab (Prediksi Stok, Omzet, Demand, Bonus Kasir, Promo & Bonus Item), akses admin-only
      (pakai access_matrix dari task 2.4), tampilkan evaluasi model (MAE/RMSE/MAPE) yang
      dipersist di cache (bukan hilang saat proses restart seperti sistem lama).
    deliverables:
      - "frontend/ml/MlPage.*"
    acceptance_criteria:
      - "Role non-admin ditolak akses (403) baik dari API maupun redirect UI"
      - "Evaluasi model tetap terlihat setelah restart backend (persist di cache/DB)"
    commands:
      - >
        python3 implementasi_plan/scripts/finish_subtask.py --task 8.6
        --title "Halaman Intelligence/ML frontend"
        --desc "5 tab admin-only + evaluasi model persisten"
        --files frontend/ml/MlPage.tsx --status done
